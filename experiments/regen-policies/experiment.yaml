name: dnsjava-regen-policies

project:
  repo: /Users/donggi/_projects/experiment-projects/dnsjava
  language: java
  build: maven
  module: .
  test_framework: junit5

anchor: "4c51bf24b320142edd2d3fe6932e767a22575bc4"   # master first-parent merge of release/3.5.x (2023-11-11). Tag v3.5.3 is off the first-parent line; this tree also holds unreleased master work (src/main +984/-225 lines vs the tag)
range:
  branch: origin/master
  end: 87409c503cce7f6278ae71534668bffa05a10f65          # 2026-10-29, 178 first-parent commits after the anchor
  mode: first-parent
  limit: null
  skip_untouched: main-sources

scope:
  rule: explicit                # last week's change-ranked rule applied by hand: class, <= 2000 lines, >= 3 methods, accessors <= 50%, cumulative focal methods 50-80
  rank_by: change-count
  min_methods: 3
  exclude_accessor_heavy: true
  target_methods: [50, 80]
  max_classes: 10
  classes:                      # m = non-private methods with a body at v3.5.3, c = changing first-parent commits after the anchor
    - org.xbill.DNS.Message     # m 32, c 14
    - org.xbill.DNS.Zone        # m 13, c 11
    - org.xbill.DNS.TSIG        # m 14, c 8
  min_classes: 1

dev:
  unmapped: exclude
  stable_runs: 3
  groups:
    - name: dev
      denominator: project
    - name: dev-scope
      display: "Dev (scope)"
      denominator: coverage-scoped
      derive_from: dev

model:
  provider: openrouter
  name: openai/gpt-oss-120b
  env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  env_key: OPENROUTER_API_KEY

generators:
  - name: ktester
    display: KTester
    method: ktester
    impl: author-tool
    tool_path: /Users/donggi/_projects/experiment-projects/KTester
    docker:
      compose_files:
        - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.yml
        - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.dnsjava.yml
      service: ktester
      mounts:
        /Users/donggi/_projects/experiment-projects/dnsjava: /repo
        /Users/donggi/_projects/experiment-projects/KTester: /work
    params: {fix_tries: 3, temperature: 0.5, workers: 8}
    rounds: {max: 1}

  - name: ouedraogo
    display: Ouédraogo
    method: ouedraogo
    impl: native
    params: {prompts: [ZSL, FSL, CoT, ToT, GToT], temperature: 0.7, max_tokens: 16384}
    rounds: {max: 2, until_dev_matched: false, stop_after_zero_compile: 2}
    context:
      dependency_signatures: {enabled: true, max_types: 15, max_lines: 400}
    prompt:
      api_constraint: true
    postprocess:
      import_repair: {enabled: true, passes: 2}

screen:
  stable_runs: 3
  dedup: exact-body
  matching: none

survival:
  definition: cumulative-fixed-denominator
  flaky_rerun: 1
  build_fail: carry-over
  environment_errors:
    patterns: ["java.net.BindException"]
    max_reruns: 3
    backoff_seconds: 5

coverage:
  changed_line: true
  at_anchor: true
  groups: alive-entering

runner:
  docker:
    image: survival-java:17           # JDK 25 fails at t: Lombok 1.18.30 cannot run on JDK 25 javac (TypeTag :: UNKNOWN)
    mounts:
      /Users/donggi/_projects/experiment-projects/dnsjava: /repo
    env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  javac_mode: reused-jvm          # active only on a JDK 25 runner; falls back to one javac per compile on JDK 17
  reuse:
    checkouts: null
    classpath_cache: null
  workers: {build: 4, survive: 4, cover: 4}   # 4 while other experiments run concurrently (Docker ~11.7 GB)
  timeouts: {build: 600, compile: 300, test_class: 120}
  jvm: {launcher: 1g, javac: 512m, jacoco: 1g}
  cache: {classpath: pom-sha256, node_modules: lockfile-sha256}

policies:
  regenerate_developer: false
  baseline: experiments/commit-survival       # "no regeneration" run of this week (read-only)
  baseline_config: null
  groups:
  - dev-scope
  - ktester
  - ouedraogo
  releases:                                   # 1/3 and 2/3 of the 178-commit range; minor v3.7.0 (index 172) is 6 commits before the end, so patch v3.6.5-1 is used
  - v3.6.0
  - v3.6.5-1
  threshold: 0.5
  max_threshold_triggers: 1
  generator_overrides:
    ktester: {params: {fix_tries: 3}}
  concurrency:
    ktester: 3
    ouedraogo: 3
    dev_selection: 1
  fill_seed: 20261029
  set:
  - name: release-reset
    trigger: release
    action: reset
  - name: half-reset
    trigger: threshold
    action: reset
  - name: half-fill
    trigger: threshold
    action: fill
